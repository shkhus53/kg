plugins {
    id 'com.android.application' version '8.7.3' apply false
}

// androidx.appcompat pulls kotlin-stdlib transitively via more than one path,
// which resolve to different Kotlin versions (1.6.21 vs 1.8.22) and produce
// duplicate-class failures at assemble time. No Kotlin plugin/source is used
// in this project — this only pins the transitive graph to one version.
subprojects {
    configurations.all {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        }
    }
}
